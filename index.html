<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script>
        (async function () {
            const deploymentVersion = "__CACHE_VERSION__";

            if (deploymentVersion === "__CACHE_VERSION__") {
                return;
            }

            const storageKey = "ExtensionWebApp:cache-version";
            try {
                const previousVersion = localStorage.getItem(storageKey);
                if (previousVersion === deploymentVersion) {
                    return;
                }

                if ("serviceWorker" in navigator) {
                    const registrations = await navigator.serviceWorker.getRegistrations();
                    await Promise.all(registrations.map(registration => registration.unregister()));
                }

                if ("caches" in window) {
                    const cacheKeys = await caches.keys();
                    await Promise.all(cacheKeys.map(cacheKey => caches.delete(cacheKey)));
                }

                localStorage.setItem(storageKey, deploymentVersion);
            } catch (error) {
                console.warn("Cache cleanup failed", error);
            }
        })();
    </script>

    <script>
        // If redirected from 404.html, restore path
        (function () {
            const params = new URLSearchParams(window.location.search);
            const path = params.get('path');
            if (path) {
                window.history.replaceState(null, '', '/ExtensionWebApp' + decodeURIComponent(path));
            }
        })();
    </script>
